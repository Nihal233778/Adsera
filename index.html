<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#667eea" />
    <title>Ton-AI TMA</title>
    
    <!-- ✅ Load Ton-AI SDK from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ton-ai-sdk/dist/ton-ai-sdk.min.js">
    </script>
    
    <!-- ✅ SDK INITIALIZATION - EXACTLY AS YOUR SCREENSHOT -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize TonAd after the DOM is ready
            // Set debug=true during testing to receive test ads
            const result = TonAdInit({ 
                appId: '6a3d6f1f003774752752430b',  // ← REPLACE with YOUR App ID
                debug: false 
            });
            console.log('📦 TonAdInit Result:', result);
            
            // Store result globally for the app to use
            window.tonAdResult = result;
            window.tonAdInitialized = true;
        });
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }
        .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        .status.ready {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .coins {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
            margin: 5px 0;
        }
        .coins span {
            font-size: 1.5rem;
            color: #888;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .msg.show {
            display: block;
        }
        .msg.success {
            background: #d4edda;
            color: #155724;
        }
        .msg.error {
            background: #f8d7da;
            color: #721c24;
        }
        .history {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            text-align: left;
            font-size: 0.85rem;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
        }
        .history div {
            padding: 5px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .footer {
            margin-top: 15px;
            color: #bbb;
            font-size: 0.7rem;
        }
        .ad-container {
            margin: 10px 0;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            min-height: 50px;
            display: none;
            background: #fafafa;
        }
        .ad-container.show {
            display: block;
        }
        .ad-container iframe {
            width: 100%;
            border: none;
            min-height: 250px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎯 Ton-AI</h1>
    <p class="sub">Telegram Mini App</p>
    
    <div class="status loading" id="status">⏳ Loading...</div>
    
    <div class="coins" id="coins">0 <span>🪙</span></div>
    <p style="color:#888;font-size:0.8rem;margin-top:-5px;">Coins</p>
    
    <div class="ad-container" id="adContainer"></div>
    
    <button class="btn btn-primary" id="watchBtn" disabled>
        🎬 Watch Ad & Earn
    </button>
    
    <button class="btn btn-secondary" id="resetBtn">
        🔄 Reset
    </button>
    
    <div class="msg" id="msg"></div>
    
    <div class="history" id="history">
        <div style="text-align:center;color:#ccc;">No rewards yet</div>
    </div>
    
    <div class="footer">🔹 Ton-AI SDK</div>
</div>

<!-- ============================================================ -->
<!-- MAIN APP LOGIC -->
<!-- ============================================================ -->
<script>
    // =============================================================
    // 🔑 CONFIGURATION - REPLACE WITH YOUR IDs
    // =============================================================
    const CONFIG = {
        APP_ID: '6a3d6f1f003774752752430b',      // ← Your App ID
        BLOCK_ID: '6a3ca3ebcb303f35e850f89b', // ← Your Block ID
        DEBUG: true
    };
    
    // =============================================================
    // STATE
    // =============================================================
    let state = {
        coins: 0,
        rewards: 0,
        history: [],
        sdkReady: false,
        isLoading: false
    };
    
    // =============================================================
    // DOM REFS
    // =============================================================
    const dom = {
        status: document.getElementById('status'),
        coins: document.getElementById('coins'),
        watchBtn: document.getElementById('watchBtn'),
        resetBtn: document.getElementById('resetBtn'),
        msg: document.getElementById('msg'),
        history: document.getElementById('history'),
        adContainer: document.getElementById('adContainer')
    };
    
    // =============================================================
    // UI HELPERS
    // =============================================================
    function updateUI() {
        dom.coins.innerHTML = state.coins + ' <span>🪙</span>';
        renderHistory();
    }
    
    function showMsg(text, type) {
        dom.msg.textContent = text;
        dom.msg.className = 'msg show ' + type;
        clearTimeout(dom.msg._timeout);
        dom.msg._timeout = setTimeout(() => { dom.msg.className = 'msg'; }, 4000);
    }
    
    function setStatus(text, type) {
        dom.status.textContent = text;
        dom.status.className = 'status ' + type;
    }
    
    function setLoading(loading) {
        state.isLoading = loading;
        dom.watchBtn.disabled = loading || !state.sdkReady;
        dom.watchBtn.textContent = loading ? '⏳ Loading...' : '🎬 Watch Ad & Earn';
    }
    
    function renderHistory() {
        if (state.history.length === 0) {
            dom.history.innerHTML = '<div style="text-align:center;color:#ccc;">No rewards yet</div>';
            return;
        }
        dom.history.innerHTML = state.history.map(item => 
            '<div>✅ ' + item.text + ' <span style="float:right;color:#ccc;">' + item.time + '</span></div>'
        ).join('');
    }
    
    // =============================================================
    // CHECK SDK STATUS
    // =============================================================
    function checkSDKStatus() {
        // Check if SDK was initialized from head
        if (window.tonAdInitialized) {
            console.log('✅ SDK already initialized from head');
            const result = window.tonAdResult;
            if (result && result.success !== false) {
                state.sdkReady = true;
                setStatus('✅ SDK Connected', 'ready');
                dom.watchBtn.disabled = false;
                showMsg('✅ SDK ready!', 'success');
                return true;
            } else {
                setStatus('❌ SDK Error', 'error');
                dom.watchBtn.disabled = true;
                showMsg('❌ SDK initialization failed', 'error');
                return false;
            }
        }
        
        // Check if TonAdInit is available globally
        if (typeof TonAdInit !== 'undefined') {
            try {
                const result = TonAdInit({ 
                    appId: CONFIG.APP_ID, 
                    debug: CONFIG.DEBUG 
                });
                console.log('📦 TonAdInit Result:', result);
                
                if (result && result.success !== false) {
                    state.sdkReady = true;
                    setStatus('✅ SDK Connected', 'ready');
                    dom.watchBtn.disabled = false;
                    showMsg('✅ SDK ready!', 'success');
                    return true;
                }
            } catch (err) {
                console.error('❌ SDK init error:', err);
            }
        }
        
        // SDK not ready
        setStatus('⏳ Waiting for SDK...', 'loading');
        dom.watchBtn.disabled = true;
        return false;
    }
    
    // =============================================================
    // GRANT REWARD
    // =============================================================
    function grantReward(ad) {
        state.coins += 10;
        state.rewards += 1;
        state.history.unshift({
            text: '+10 coins from ad',
            time: new Date().toLocaleTimeString()
        });
        updateUI();
        showMsg('🎉 +10 coins earned!', 'success');
        console.log('✅ Reward granted:', ad);
    }
    
    // =============================================================
    // SHOW AD
    // =============================================================
    function showAd() {
        if (!state.sdkReady) {
            showMsg('⏳ SDK not ready', 'error');
            return;
        }
        if (state.isLoading) return;
        
        setLoading(true);
        showMsg('📡 Loading ad...', '');
        
        try {
            // Try TonAdBanner (most common)
            if (typeof TonAdBanner !== 'undefined') {
                dom.adContainer.className = 'ad-container show';
                dom.adContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">📺 Loading ad...</div>';
                
                TonAdBanner({
                    blockId: CONFIG.BLOCK_ID,
                    onAdClick: function(ad) {
                        dom.adContainer.className = 'ad-container';
                        grantReward(ad);
                        setLoading(false);
                    },
                    onAdError: function(err) {
                        dom.adContainer.className = 'ad-container';
                        showMsg('❌ Ad error: ' + (err || 'Unknown'), 'error');
                        setLoading(false);
                    },
                    onAdClose: function() {
                        dom.adContainer.className = 'ad-container';
                        setLoading(false);
                    }
                });
            } 
            // Try TonAdPopupShow (alternative)
            else if (typeof TonAdPopupShow !== 'undefined') {
                TonAdPopupShow({
                    blockId: CONFIG.BLOCK_ID,
                    onAdClick: function(ad) {
                        grantReward(ad);
                        setLoading(false);
                    },
                    onAdError: function(err) {
                        showMsg('❌ Ad error', 'error');
                        setLoading(false);
                    },
                    onAdClose: function() {
                        setLoading(false);
                    }
                });
            } 
            else {
                showMsg('❌ No ad method available in SDK', 'error');
                setLoading(false);
                console.error('❌ Available Ton methods:', Object.keys(window).filter(k => k.includes('Ton')));
            }
        } catch (err) {
            showMsg('❌ ' + err.message, 'error');
            setLoading(false);
            dom.adContainer.className = 'ad-container';
            console.error('❌ Ad error:', err);
        }
    }
    
    // =============================================================
    // RESET
    // =============================================================
    function resetAll() {
        if (state.coins === 0 && state.rewards === 0) {
            showMsg('Nothing to reset', '');
            return;
        }
        if (confirm('Reset all progress?')) {
            state.coins = 0;
            state.rewards = 0;
            state.history = [];
            updateUI();
            showMsg('🔄 Reset complete', '');
        }
    }
    
    // =============================================================
    // CHECK AVAILABLE SDK METHODS
    // =============================================================
    function checkAvailableMethods() {
        const methods = Object.keys(window).filter(k => k.includes('Ton'));
        console.log('🔍 Available Ton methods:', methods);
        
        // Check specific methods
        const available = {
            'TonAdInit': typeof TonAdInit !== 'undefined',
            'TonAdBanner': typeof TonAdBanner !== 'undefined',
            'TonAdPopupShow': typeof TonAdPopupShow !== 'undefined',
            'GetTonAd': typeof GetTonAd !== 'undefined',
            'TonSDK': typeof TonSDK !== 'undefined'
        };
        console.log('📦 Methods available:', available);
        return available;
    }
    
    // =============================================================
    // INITIALIZE APP
    // =============================================================
    function initApp() {
        console.log('🚀 Starting Ton-AI App...');
        console.log('📌 App ID:6a3d6f1f003774752752430b', CONFIG.APP_ID);
        console.log('📌 Block ID:6a3ca3ebcb303f35e850f89b', CONFIG.BLOCK_ID);
        
        // Check SDK status
        checkAvailableMethods();
        
        // Check if SDK is ready
        const ready = checkSDKStatus();
        
        // If not ready, try again after delay
        if (!ready) {
            console.log('⏳ SDK not ready, retrying...');
            setTimeout(function() {
                checkSDKStatus();
            }, 1000);
        }
        
        // Update UI
        updateUI();
    }
    
    // =============================================================
    // EVENT LISTENERS
    // =============================================================
    dom.watchBtn.addEventListener('click', showAd);
    dom.resetBtn.addEventListener('click', resetAll);
    
    // =============================================================
    // START APP
    // =============================================================
    document.addEventListener('DOMContentLoaded', function() {
        // Give SDK a moment to initialize
        setTimeout(initApp, 300);
    });
    
    // Also try when page fully loads
    window.addEventListener('load', function() {
        // If not ready yet, try again
        if (!state.sdkReady) {
            checkSDKStatus();
        }
    });
    
    // =============================================================
    // DEBUG HELP
    // =============================================================
    console.log('💡 Debug Commands:');
    console.log('  window.__app.checkSDK() - Check SDK status');
    console.log('  window.__app.showAd() - Show ad manually');
    console.log('  window.__app.reset() - Reset progress');
    console.log('  window.__app.state - View current state');
    
    window.__app = {
        state: state,
        CONFIG: CONFIG,
        showAd: showAd,
        reset: resetAll,
        checkSDK: checkSDKStatus,
        checkMethods: checkAvailableMethods,
        grantReward: grantReward
    };
</script>

</body>
</html>
