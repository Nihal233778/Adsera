<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>✨ GlowKit — Telegram Mini App</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    
    <!-- TonAd SDK - Using correct function name: TonADinit -->
    <script src="https://cdn.jsdelivr.net/npm/ton-ai-sdk@latest/dist/index.js"></script>
    
    <script>
        // Initialize TonAd after SDK loads
        document.addEventListener('DOMContentLoaded', function () {
            // Check if TonADinit is available (correct function name)
            if (typeof TonADinit !== 'undefined') {
                try {
                    const result = TonADinit({ 
                        appId: '6a3d6f1f003774752752430b',
                        debug: true
                    });
                    console.log('✅ TonADinit initialized:', result);
                    window.__tonAdInitResult = result;
                    window.__tonAdReady = true;
                } catch(e) {
                    console.error('❌ TonADinit error:', e);
                    // Try alternative function name if available
                    if (typeof TonAdInit !== 'undefined') {
                        try {
                            const result = TonAdInit({ 
                                appId: '6a3d6f1f003774752752430b',
                                debug: true
                            });
                            console.log('✅ TonAdInit (fallback) initialized:', result);
                            window.__tonAdInitResult = result;
                            window.__tonAdReady = true;
                        } catch(e2) {
                            console.error('❌ TonAdInit fallback error:', e2);
                        }
                    }
                }
            } else {
                console.warn('⚠️ TonADinit not available. SDK may not have loaded.');
                window.__tonAdReady = false;
            }
        });
    </script>
    
    <style>
        /* ... your styles ... */
    </style>
</head>
<body>
    <!-- ... your app content ... -->
</body>
</html>
