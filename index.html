<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>✨ GlowKit — Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <style>
        /* (same as previous GlowKit styles – reuse them) */
        /* ... paste all styles from the previous answer ... */
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="header">
        <div class="user-greeting" id="greetingText">✨ Glow User</div>
        <div class="avatar-badge" id="avatarBadge">😎</div>
    </div>

    <div class="karma-card">
        <div class="karma-value" id="karmaValue">0</div>
        <div class="karma-label">🌟 Your Karma Stars</div>
        <div class="action-buttons">
            <button class="btn" id="boostBtn">⚡ Boost +5</button>
            <button class="btn btn-outline" id="resetBtn">🔄 Reset</button>
        </div>
        <button class="btn btn-ad" id="adRewardBtn">🎥 Watch Ad & Earn +5 Karma</button>
        <div class="ad-status" id="adStatus">💰 Watch rewarded ads to boost your karma!</div>
    </div>

    <div class="feature-grid">
        <div class="feature-card" id="dailyBonus"><div class="feature-emoji">🎁</div><div class="feature-title">Daily Bonus</div><div class="feature-desc">Claim +3 karma</div></div>
        <div class="feature-card" id="luckyWheelHint"><div class="feature-emoji">🎲</div><div class="feature-title">Lucky Moment</div><div class="feature-desc">Random 1–10 karma</div></div>
        <div class="feature-card" id="shareCard"><div class="feature-emoji">📤</div><div class="feature-title">Share Progress</div><div class="feature-desc">Invite friends</div></div>
        <div class="feature-card" id="themeToggleHint"><div class="feature-emoji">🎨</div><div class="feature-title">Theme Magic</div><div class="feature-desc">Toggle vibe</div></div>
    </div>

    <div class="info-panel"><span>🔹 Telegram ID</span><strong id="tgUserId">—</strong></div>
    <div class="info-panel"><span>🔗 Share this mini app</span><button class="copy-link-btn" id="copyLinkBtn">📋 Copy link</button></div>
    <div class="tg-main-btn-hint" id="mainBtnHint"></div>
    <footer>✨ powered by Telegram Mini App | Ads by Ad3s3</footer>
</div>

<script>
    (function(){
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ---------- CONFIG ----------
        const BACKEND_URL = 'https://your-server.com';   // <-- CHANGE
        const BLOCK_ID = 'YOUR_BLOCK_ID';               // <-- CHANGE (from your Astergame platform)

        // ---------- DOM refs ----------
        const karmaSpan = document.getElementById('karmaValue');
        const greetingDiv = document.getElementById('greetingText');
        const avatarBadge = document.getElementById('avatarBadge');
        const userIdSpan = document.getElementById('tgUserId');
        const boostBtn = document.getElementById('boostBtn');
        const resetBtn = document.getElementById('resetBtn');
        const dailyBonusBtn = document.getElementById('dailyBonus');
        const luckyWheel = document.getElementById('luckyWheelHint');
        const shareCard = document.getElementById('shareCard');
        const themeToggle = document.getElementById('themeToggleHint');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const mainHint = document.getElementById('mainBtnHint');
        const adRewardBtn = document.getElementById('adRewardBtn');
        const adStatus = document.getElementById('adStatus');

        // ---------- State ----------
        let karma = 0;
        let lastDailyClaim = null;
        let openId = '';
        let pollInterval = null;
        const STORAGE_KEY = 'glowkit_karma_data';

        // ---------- Storage ----------
        function persistData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ karma, lastDailyClaim }));
        }
        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if(!raw) return;
            try {
                const data = JSON.parse(raw);
                if(typeof data.karma === 'number') karma = data.karma;
                if(data.lastDailyClaim) lastDailyClaim = data.lastDailyClaim;
                updateKarmaUI();
            } catch(e) { console.warn(e); }
        }

        // ---------- UI update ----------
        function updateKarmaUI() {
            karmaSpan.innerText = karma;
            karmaSpan.classList.add('karma-pop');
            setTimeout(() => karmaSpan.classList.remove('karma-pop'), 300);
            persistData();
            if(karma >= 50) {
                tg.MainButton.setText("🎉 Legendary! Share it 🎉");
                tg.MainButton.show();
                tg.MainButton.onClick(() => { shareAppLink(); tg.MainButton.hide(); });
                mainHint.innerText = "✨ Main button: share your achievement!";
            } else {
                tg.MainButton.hide();
                mainHint.innerText = "✨ Get 50 karma to unlock magic main button!";
            }
        }

        // ---------- Haptic ----------
        function haptic(style = 'light') {
            if(tg.HapticFeedback) {
                const map = { light:'impactOccurred', medium:'impactOccurred', heavy:'impactOccurred', success:'notificationOccurred', error:'notificationOccurred' };
                const method = map[style] || 'impactOccurred';
                const param = style === 'success' ? 'success' : style === 'error' ? 'error' : style;
                tg.HapticFeedback[method](param);
            }
        }

        // ---------- Add karma ----------
        function addKarma(amount, showToast = true) {
            if(amount > 0) {
                karma += amount;
                updateKarmaUI();
                if(showToast) {
                    tg.showPopup({ title: "✨ Karma +" + amount, message: `You earned ${amount} karma stars!`, buttons: [{type: "ok"}] });
                    haptic('success');
                }
            } else if (amount < 0 && karma + amount >= 0) {
                karma += amount;
                updateKarmaUI();
                haptic('medium');
            } else if(amount < 0 && karma + amount < 0) {
                tg.showPopup({ title: "Oops!", message: "Can't go below zero karma 😇", buttons: [{type: "ok"}] });
                haptic('error');
                return false;
            }
            return true;
        }

        // ---------- Reset, Daily, Lucky, Share, Theme (same as before) ----------
        function resetKarma() {
            tg.showPopup({
                title: "Reset Karma?",
                message: "Are you sure?",
                buttons: [{id:"cancel", type:"cancel"}, {id:"confirm", type:"default", text:"Reset"}]
            }, (btnId) => {
                if(btnId === "confirm") {
                    karma = 0;
                    updateKarmaUI();
                    tg.showToast({text: "Karma reset 🌱", duration: 1500});
                    haptic('medium');
                }
            });
        }
        function claimDailyBonus() {
            const now = Date.now();
            const DAY_MS = 24*60*60*1000;
            if(lastDailyClaim && (now - lastDailyClaim) < DAY_MS) {
                const hoursLeft = Math.ceil((DAY_MS - (now - lastDailyClaim)) / (1000*60*60));
                tg.showPopup({ title: "Already claimed 🕒", message: `Available in ~${hoursLeft}h`, buttons: [{type:"ok"}] });
                haptic('error');
                return;
            }
            addKarma(3, true);
            lastDailyClaim = now;
            persistData();
            tg.showToast({text: "🎁 Daily +3 Karma!", duration: 2000});
            haptic('success');
        }
        function luckyMoment() {
            const bonus = Math.floor(Math.random() * 10) + 1;
            addKarma(bonus, true);
            tg.showToast({text: `🎲 Lucky! +${bonus} karma`, duration: 2000});
            haptic('light');
        }
        function shareAppLink() {
            const url = window.location.href;
            if(navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    tg.showPopup({ title: "Link copied!", message: "Share with friends ✨", buttons: [{type:"ok"}] });
                    haptic('success');
                }).catch(() => tg.showPopup({title: "Error", message: "Could not copy", buttons: [{type:"ok"}]}));
            } else {
                tg.showPopup({title: "Info", message: "Please share manually", buttons:[{type:"ok"}]});
            }
        }
        function magicThemeEffect() {
            document.body.style.transition = 'background 0.4s';
            if(tg.colorScheme === 'dark') {
                document.body.style.backgroundColor = '#1e2a3a';
                setTimeout(() => document.body.style.backgroundColor = '', 600);
            } else {
                document.body.style.backgroundColor = '#fff9ef';
                setTimeout(() => document.body.style.backgroundColor = '', 600);
            }
            tg.showToast({text: "🌈✨ Theme shimmer!", duration: 1000});
            haptic('light');
        }

        // ---------- Ad3s3 Integration ----------
        function watchAd() {
            if (!openId) {
                tg.showPopup({ title: "Error", message: "User ID not available. Please restart.", buttons: [{type:"ok"}] });
                return;
            }

            adStatus.innerText = "📺 Launching ad... please wait";
            haptic('light');

            // Open Ad3s3 ad offer (replace with actual URL format)
            // According to Ad3s3 documentation, you need to open a link with parameters.
            // Usually it's: https://ad3s3.com/offer?blockId=BLOCK_ID&openId=USER_ID&type=telegram
            const adUrl = `https://ad3s3.com/offer?blockId=${BLOCK_ID}&openId=${openId}&type=telegram`;
            tg.openLink(adUrl); // opens in Telegram's built-in browser

            // Start polling for reward
            adStatus.innerText = "⏳ Ad launched. Checking for reward...";
            startPolling();
        }

        // Polling: ask backend for pending reward
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${BACKEND_URL}/api/rewards/${openId}`);
                    const data = await response.json();
                    if (data.karmaBonus && data.karmaBonus > 0) {
                        addKarma(data.karmaBonus, true);
                        adStatus.innerText = "✅ Ad rewarded! +5 Karma earned!";
                        setTimeout(() => {
                            adStatus.innerText = "💰 Watch rewarded ads to boost your karma!";
                        }, 3000);
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                } catch (e) {
                    console.warn("Polling error:", e);
                }
            }, 3000);
        }

        // ---------- Init Telegram user ----------
        function initTelegramUser() {
            const initData = tg.initDataUnsafe;
            let user = initData?.user;
            if(user && user.id) {
                openId = String(user.id);
                const firstName = user.first_name || 'User';
                greetingDiv.innerHTML = `✨ Hello, ${firstName.split(' ')[0]}!`;
                if(user.username) greetingDiv.innerHTML += ` @${user.username}`;
                userIdSpan.innerText = user.id;
                let avatarLetter = firstName.charAt(0).toUpperCase() || '😊';
                avatarBadge.innerHTML = avatarLetter;
                avatarBadge.style.background = `linear-gradient(145deg, var(--tg-theme-button-color), #a363d9)`;
                avatarBadge.style.color = 'white';
            } else {
                greetingDiv.innerHTML = `🌟 Guest Explorer`;
                userIdSpan.innerText = 'web_demo';
                openId = 'demo_user';
                avatarBadge.innerHTML = '🚀';
                tg.showPopup({ title: "✨ Welcome Demo", message: "Using test mode. Karma saved locally.", buttons: [{type:"ok"}] });
            }
            if(tg.colorScheme === 'dark') document.body.style.background = 'var(--tg-theme-bg-color)';
            tg.ready();
        }

        // ---------- Event binding ----------
        function bindEvents() {
            boostBtn.addEventListener('click', () => { addKarma(5, true); haptic('medium'); });
            resetBtn.addEventListener('click', resetKarma);
            dailyBonusBtn.addEventListener('click', claimDailyBonus);
            luckyWheel.addEventListener('click', luckyMoment);
            shareCard.addEventListener('click', shareAppLink);
            themeToggle.addEventListener('click', magicThemeEffect);
            copyLinkBtn.addEventListener('click', shareAppLink);
            adRewardBtn.addEventListener('click', watchAd);
        }

        // ---------- Theme sync ----------
        function syncTheme() {
            const root = document.documentElement;
            const tp = tg.themeParams;
            if(tp) {
                root.style.setProperty('--tg-theme-bg-color', tp.bg_color || '#ffffff');
                root.style.setProperty('--tg-theme-text-color', tp.text_color || '#000000');
                root.style.setProperty('--tg-theme-hint-color', tp.hint_color || '#999999');
                root.style.setProperty('--tg-theme-link-color', tp.link_color || '#2aabee');
                root.style.setProperty('--tg-theme-button-color', tp.button_color || '#2aabee');
                root.style.setProperty('--tg-theme-button-text-color', tp.button_text_color || '#ffffff');
                root.style.setProperty('--tg-theme-secondary-bg-color', tp.secondary_bg_color || '#f0f0f0');
            }
        }

        // ---------- Boot ----------
        syncTheme();
        loadData();
        initTelegramUser();
        bindEvents();
        updateKarmaUI();

        window.addEventListener('load', () => tg.expand());
        tg.onEvent('mainButtonClicked', shareAppLink);

        setTimeout(() => {
            if(karma === 0) {
                tg.showPopup({ title: "🌟 Start your journey!", message: "Earn karma by boosting, daily bonus, or watching ads!", buttons: [{type:"ok"}] });
            }
        }, 500);
    })();
</script>
</body>
</html>
