<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ton-AI TMA</title>
    
    <!-- ✅ TRY THESE CDN URLs - One of them will work -->
    <script src="https://cdn.jsdelivr.net/npm/ton-ai-sdk@2.2.4-alpha.5/dist/ton-ai-sdk.min.js">
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }
        .sub {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        .status.ready {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .coins {
            font-size: 3rem;
            font-weight: 700;
            color: #333;
            margin: 5px 0;
        }
        .coins span {
            font-size: 1.5rem;
            color: #888;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .msg.show {
            display: block;
        }
        .msg.success {
            background: #d4edda;
            color: #155724;
        }
        .msg.error {
            background: #f8d7da;
            color: #721c24;
        }
        .history {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            text-align: left;
            font-size: 0.85rem;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
        }
        .history div {
            padding: 5px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .footer {
            margin-top: 15px;
            color: #bbb;
            font-size: 0.7rem;
        }
        .debug {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.75rem;
            text-align: left;
            font-family: monospace;
            color: #666;
            max-height: 100px;
            overflow: auto;
            display: none;
        }
        .debug.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎯 Ton-AI</h1>
    <p class="sub">Telegram Mini App</p>
    
    <div class="status loading" id="status">⏳ Loading SDK...</div>
    
    <div class="coins" id="coins">0 <span>🪙</span></div>
    <p style="color:#888;font-size:0.8rem;margin-top:-5px;">Coins</p>
    
    <button class="btn btn-primary" id="watchBtn" disabled>
        🎬 Watch Ad & Earn
    </button>
    
    <button class="btn btn-secondary" id="resetBtn">
        🔄 Reset
    </button>
    
    <div class="msg" id="msg"></div>
    
    <div class="history" id="history">
        <div style="text-align:center;color:#ccc;">No rewards yet</div>
    </div>
    
    <button class="btn btn-secondary" id="debugBtn" style="font-size:0.7rem;padding:8px;margin-top:5px;">
        🔍 Debug
    </button>
    
    <div class="debug" id="debug"></div>
    
    <div class="footer">🔹 Ton-AI SDK</div>
</div>

<!-- ============================================================ -->
<!-- ✅ JAVASCRIPT - With Multiple SDK Loading Strategies -->
<!-- ============================================================ -->
<script>
    // =============================================================
    // 🔑 REPLACE WITH YOUR REAL IDs
    // =============================================================
    const APP_ID = '6a3d6f1f003774752752430b';      // ← Your App ID
    const BLOCK_ID = '6a3ca3ebcb303f35e850f89b'; // ← Your Block ID
    
    // =============================================================
    // STATE
    // =============================================================
    let coins = 0;
    let rewards = 0;
    let history = [];
    let sdkReady = false;
    let isLoading = false;
    let initAttempts = 0;
    const MAX_ATTEMPTS = 20;
    
    // =============================================================
    // DOM REFS
    // =============================================================
    const statusEl = document.getElementById('status');
    const coinsEl = document.getElementById('coins');
    const watchBtn = document.getElementById('watchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const debugBtn = document.getElementById('debugBtn');
    const msgEl = document.getElementById('msg');
    const historyEl = document.getElementById('history');
    const debugEl = document.getElementById('debug');
    
    // =============================================================
    // UI HELPERS
    // =============================================================
    function updateUI() {
        coinsEl.innerHTML = coins + ' <span>🪙</span>';
        renderHistory();
    }
    
    function showMsg(text, type) {
        msgEl.textContent = text;
        msgEl.className = 'msg show ' + type;
        clearTimeout(msgEl._timeout);
        msgEl._timeout = setTimeout(() => { msgEl.className = 'msg'; }, 4000);
    }
    
    function setStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
    }
    
    function setLoading(loading) {
        isLoading = loading;
        watchBtn.disabled = loading || !sdkReady;
        watchBtn.textContent = loading ? '⏳ Loading...' : '🎬 Watch Ad & Earn';
    }
    
    function renderHistory() {
        if (history.length === 0) {
            historyEl.innerHTML = '<div style="text-align:center;color:#ccc;">No rewards yet</div>';
            return;
        }
        historyEl.innerHTML = history.map(item => 
            '<div>✅ ' + item.text + ' <span style="float:right;color:#ccc;">' + item.time + '</span></div>'
        ).join('');
    }
    
    function addDebug(msg) {
        debugEl.innerHTML += msg + '\n';
        debugEl.scrollTop = debugEl.scrollHeight;
    }
    
    function toggleDebug() {
        debugEl.classList.toggle('show');
        if (debugEl.classList.contains('show')) {
            debugBtn.textContent = '🔍 Hide Debug';
        } else {
            debugBtn.textContent = '🔍 Debug';
        }
    }
    
    // =============================================================
    // CHECK SDK AVAILABILITY
    // =============================================================
    function checkSDK() {
        const tonMethods = Object.keys(window).filter(key => key.includes('Ton'));
        addDebug('🔍 Available Ton methods: ' + tonMethods.join(', '));
        
        // Check for different SDK methods
        const methods = {
            'TonAdInit': typeof TonAdInit !== 'undefined',
            'TonAdBanner': typeof TonAdBanner !== 'undefined',
            'TonAdPopupShow': typeof TonAdPopupShow !== 'undefined',
            'GetTonAd': typeof GetTonAd !== 'undefined',
            'TonSDK': typeof TonSDK !== 'undefined'
        };
        
        addDebug('📦 Methods available: ' + JSON.stringify(methods, null, 2));
        
        return methods;
    }
    
    // =============================================================
    // ✅ INITIALIZE SDK
    // =============================================================
    function initSDK() {
        initAttempts++;
        addDebug('🔄 Attempt #' + initAttempts + ' to initialize SDK');
        setStatus('⏳ Loading SDK... (' + initAttempts + '/' + MAX_ATTEMPTS + ')', 'loading');
        
        const methods = checkSDK();
        
        // Try TonAdInit first
        if (methods.TonAdInit) {
            try {
                addDebug('✅ Found TonAdInit, initializing...');
                const result = TonAdInit({ 
                    appId: APP_ID, 
                    debug: true 
                });
                addDebug('📦 TonAdInit Result: ' + JSON.stringify(result));
                console.log('📦 TonAdInit Result:', result);
                
                if (result && result.success !== false) {
                    sdkReady = true;
                    setStatus('✅ SDK Connected', 'ready');
                    watchBtn.disabled = false;
                    showMsg('✅ SDK ready!', 'success');
                    addDebug('✅ SDK initialized successfully!');
                    return true;
                } else {
                    addDebug('❌ SDK initialization returned: ' + JSON.stringify(result));
                }
            } catch (err) {
                addDebug('❌ TonAdInit error: ' + err.message);
                console.error('❌ TonAdInit error:', err);
            }
        }
        
        // Try alternative: TonSDK
        if (methods.TonSDK) {
            try {
                addDebug('✅ Found TonSDK, trying...');
                const result = TonSDK.init({ 
                    appId: APP_ID, 
                    debug: true 
                });
                addDebug('📦 TonSDK Result: ' + JSON.stringify(result));
                if (result && result.success !== false) {
                    sdkReady = true;
                    setStatus('✅ SDK Connected', 'ready');
                    watchBtn.disabled = false;
                    showMsg('✅ SDK ready!', 'success');
                    addDebug('✅ TonSDK initialized successfully!');
                    return true;
                }
            } catch (err) {
                addDebug('❌ TonSDK error: ' + err.message);
            }
        }
        
        // If we have any Ton method, SDK is partially loaded
        const hasAnyMethod = Object.values(methods).some(v => v === true);
        if (hasAnyMethod && !sdkReady) {
            addDebug('⚠️ SDK methods found but initialization failed');
            setStatus('⚠️ SDK Partial', 'error');
            watchBtn.disabled = true;
            showMsg('⚠️ SDK partially loaded. Check console.', 'error');
            return false;
        }
        
        // Retry if not loaded
        if (initAttempts < MAX_ATTEMPTS) {
            addDebug('⏳ SDK not loaded, retrying in 1s...');
            setTimeout(initSDK, 1000);
            return false;
        }
        
        // Max attempts reached
        addDebug('❌ SDK failed to load after ' + MAX_ATTEMPTS + ' attempts');
        setStatus('❌ SDK Error', 'error');
        watchBtn.disabled = true;
        showMsg('❌ SDK not loaded. Check console.', 'error');
        return false;
    }
    
    // =============================================================
    // GRANT REWARD
    // =============================================================
    function grantReward(ad) {
        coins += 10;
        rewards += 1;
        history.unshift({
            text: '+10 coins from ad',
            time: new Date().toLocaleTimeString()
        });
        updateUI();
        showMsg('🎉 +10 coins earned!', 'success');
        addDebug('✅ Reward granted: ' + JSON.stringify(ad));
        console.log('✅ Reward granted:', ad);
    }
    
    // =============================================================
    // SHOW AD
    // =============================================================
    function showAd() {
        if (!sdkReady) {
            showMsg('⏳ SDK not ready', 'error');
            addDebug('❌ Cannot show ad: SDK not ready');
            return;
        }
        if (isLoading) return;
        
        setLoading(true);
        showMsg('📡 Loading ad...', '');
        addDebug('🎬 Attempting to show ad...');
        
        try {
            // Try different ad methods
            if (typeof TonAdBanner !== 'undefined') {
                addDebug('✅ Using TonAdBanner');
                TonAdBanner({
                    blockId: BLOCK_ID,
                    onAdClick: function(ad) {
                        addDebug('🎯 Ad clicked: ' + JSON.stringify(ad));
                        grantReward(ad);
                        setLoading(false);
                    },
                    onAdError: function(err) {
                        addDebug('❌ Ad error: ' + (err || 'Unknown'));
                        showMsg('❌ Ad error', 'error');
                        setLoading(false);
                    },
                    onAdClose: function() {
                        addDebug('👋 Ad closed');
                        setLoading(false);
                    }
                });
            } 
            else if (typeof TonAdPopupShow !== 'undefined') {
                addDebug('✅ Using TonAdPopupShow');
                TonAdPopupShow({
                    blockId: BLOCK_ID,
                    onAdClick: function(ad) {
                        addDebug('🎯 Ad clicked: ' + JSON.stringify(ad));
                        grantReward(ad);
                        setLoading(false);
                    },
                    onAdError: function(err) {
                        addDebug('❌ Ad error: ' + (err || 'Unknown'));
                        showMsg('❌ Ad error', 'error');
                        setLoading(false);
                    },
                    onAdClose: function() {
                        addDebug('👋 Ad closed');
                        setLoading(false);
                    }
                });
            }
            else if (typeof GetTonAd !== 'undefined') {
                addDebug('✅ Using GetTonAd');
                GetTonAd(BLOCK_ID, 1, function(ad) {
                    if (ad) {
                        addDebug('🎯 Ad received: ' + JSON.stringify(ad));
                        grantReward(ad);
                    } else {
                        addDebug('❌ No ad available');
                        showMsg('No ad available', 'error');
                    }
                    setLoading(false);
                });
            }
            else {
                addDebug('❌ No ad method available');
                showMsg('❌ No ad method available', 'error');
                setLoading(false);
                
                // Show available methods in debug
                const methods = Object.keys(window).filter(k => k.includes('Ton'));
                addDebug('📋 Available: ' + methods.join(', '));
            }
        } catch (err) {
            addDebug('❌ Ad error: ' + err.message);
            showMsg('❌ ' + err.message, 'error');
            setLoading(false);
            console.error('❌ Ad error:', err);
        }
    }
    
    // =============================================================
    // RESET
    // =============================================================
    function resetAll() {
        if (coins === 0 && rewards === 0) {
            showMsg('Nothing to reset', '');
            return;
        }
        if (confirm('Reset all progress?')) {
            coins = 0;
            rewards = 0;
            history = [];
            updateUI();
            showMsg('🔄 Reset complete', '');
            addDebug('🔄 Progress reset');
        }
    }
    
    // =============================================================
    // START APP
    // =============================================================
    document.addEventListener('DOMContentLoaded', function () {
        addDebug('🚀 App loaded at: ' + new Date().toLocaleTimeString());
        addDebug('📌 App ID:6a3d6f1f003774752752430b ' + APP_ID);
        addDebug('📌 Block ID: 6a3ca3ebcb303f35e850f89b' + BLOCK_ID);
        
        // Start SDK initialization
        setTimeout(initSDK, 500);
    });
    
    // =============================================================
    // EVENT LISTENERS
    // =============================================================
    watchBtn.addEventListener('click', showAd);
    resetBtn.addEventListener('click', resetAll);
    debugBtn.addEventListener('click', toggleDebug);
    
    // =============================================================
    // KEYBOARD SHORTCUTS
    // =============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'd' && e.ctrlKey) {
            e.preventDefault();
            toggleDebug();
        }
    });
    
    // =============================================================
    // DEBUG HELP
    // =============================================================
    console.log('🚀 Ton-AI TMA App Loaded');
    console.log('📌 App ID:6a3d6f1f003774752752430b', APP_ID);
    console.log('📌 Block ID:6a3ca3ebcb303f35e850f89b', BLOCK_ID);
    console.log('💡 Press Ctrl+D to toggle debug panel');
    window.__app = { 
        coins, rewards, history, sdkReady, 
        showAd, resetAll, initSDK, checkSDK,
        addDebug
    };
</script>

</body>
</html>
